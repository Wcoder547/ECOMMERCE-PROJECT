version: "3.9"


include:
  - ./redis/docker-compose.yaml


networks:
  default:
    driver: bridge


services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped


  backend:
    image: waseemmalik547/ecommerce-backend
    container_name: backend
    ports:
      - "4000:4000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      NODE_ENV: development
      MONGO_URI: "mongodb://admin:password@mongodb:27017/ecommerce24?authSource=admin"
      REDIS_URI: "redis://redis:6379"
    env_file:
      - ./Ecommerce-Backend/.env
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    develop:
      watch:
        - path: ./Ecommerce-Backend/package*.json
          action: rebuild
        - path: ./Ecommerce-Backend
          target: /app
          action: sync


  front-end:
    image: waseemmalik547/ecommerce-frontend
    container_name: frontend
    ports:
      - "4173:4173"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      VITE_API_URL: http://localhost:4000
    env_file:
      - ./Ecommerce-Frontend/.env
    depends_on:
      - backend
    restart: unless-stopped
    develop:
      watch:
        - path: ./Ecommerce-Frontend/package*.json
          action: rebuild
        - path: ./Ecommerce-Frontend
          target: /app
          action: sync


volumes:
  mongodb_data:
    driver: local
